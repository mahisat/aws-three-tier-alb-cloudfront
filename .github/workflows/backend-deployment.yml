name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deployment.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  BACKEND_INSTANCE_TAG: my-project-backend-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command (all in-service ASG instances)
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${BACKEND_INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No running backend instances found for tag Name=${BACKEND_INSTANCE_TAG}"
            exit 1
          fi

          echo "Target instances: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters commands='[
              "set -euo pipefail",
              "sudo -u ec2-user bash -lc \"cd /home/ec2-user/app && git pull origin main\"",
              "chown -R ec2-user:ec2-user /home/ec2-user/app",
              "sudo -u ec2-user bash -lc \"cd /home/ec2-user/app/backend && npm ci && npm run build\"",
              "systemctl restart todo-backend",
              "sleep 2",
              "systemctl is-active todo-backend",
              "curl -sf http://127.0.0.1:5000/health"
            ]' \
            --comment "GitHub Actions backend deploy" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id: $COMMAND_ID"

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for instance $INSTANCE_ID..."
            if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
              echo "::warning::SSM command finished with non-success status on $INSTANCE_ID"
            fi

            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json)

            STATUS=$(echo "$INVOCATION" | jq -r '.Status')
            echo "Instance $INSTANCE_ID — SSM status: $STATUS"
            echo "---------- stdout ----------"
            echo "$INVOCATION" | jq -r '.StandardOutputContent // empty'
            echo "---------- stderr ----------"
            echo "$INVOCATION" | jq -r '.StandardErrorContent // empty'

            if [ "$STATUS" != "Success" ]; then
              exit 1
            fi
          done

          echo "Backend deployed successfully on all instances via SSM"
